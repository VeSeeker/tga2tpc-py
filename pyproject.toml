[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tga2tpc-py"
version = "1.0.0"
description = "Convert TGA images to BioWare Odyssey engine TPC textures"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "VeSeeker" },
]
maintainers = [
    { name = "" },
]
keywords = ["KotOR", "Odyssey", "TPC", "TGA", "image", "convert"]
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
tga2tpc = "tga2tpc.cli:main"

[project.urls]
Source = "https://github.com/VeSeeker/tga2tpc-py"

[tool.setuptools]
packages = ["tga2tpc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
